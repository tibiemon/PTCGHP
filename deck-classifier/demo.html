<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>デッキ自動判定ロジック — デモ</title>
<style>
    :root {
      --bg: #F8F8F8; --surface: #fff; --border: #E0E0E0;
      --text: #1E1E1E; --muted: #888; --accent: #2D2D2D;
      --green: #2E7D32; --orange: #E65100; --red: #B71C1C;
      --radius: 8px; --font: 'Hiragino Kaku Gothic ProN','Hiragino Sans',
        'Noto Sans JP','Yu Gothic',sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text);
           font-size: 14px; line-height: 1.6; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 32px; }

    /* ── パネル ── */
    .panel { background: var(--surface); border: 1px solid var(--border);
             border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
    .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 16px;
                   padding-bottom: 8px; border-bottom: 2px solid var(--accent); }

    /* ── 入力エリア ── */
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    input[type=text], select {
      flex: 1; min-width: 160px; height: 36px; padding: 0 10px;
      border: 1px solid var(--border); border-radius: 4px;
      font-family: var(--font); font-size: 13px; background: var(--bg);
    }
    input[type=number] {
      width: 70px; height: 36px; padding: 0 8px;
      border: 1px solid var(--border); border-radius: 4px;
      font-family: var(--font); font-size: 13px; background: var(--bg);
    }
    button {
      height: 36px; padding: 0 16px; border: none; border-radius: 4px;
      font-family: var(--font); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #444; }
    .btn-danger  { background: #eee; color: #c00; }
    .btn-danger:hover { background: #fdd; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* ── カードリスト ── */
    #card-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .card-row {
      display: grid; grid-template-columns: 1fr 80px 100px 28px;
      gap: 6px; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 10px;
    }
    .card-row .card-name { font-weight: 600; font-size: 13px; }
    .card-row .card-count { font-size: 12px; color: var(--muted); }
    .card-row .card-cat { font-size: 11px; }
    .remove-btn { background: none; border: none; color: #bbb; font-size: 16px;
                  cursor: pointer; line-height: 1; padding: 0; }
    .remove-btn:hover { color: #c00; }

    /* ── プリセット ── */
    .preset-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .preset-btn {
      height: 30px; padding: 0 12px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 100px;
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: .15s;
    }
    .preset-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── 判定結果 ── */
    #result { display: none; }
    .result-box {
      border: 2px solid var(--accent); border-radius: var(--radius);
      padding: 20px; background: var(--surface);
    }
    .result-name { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .result-meta { display: flex; gap: 12px; align-items: center;
                   flex-wrap: wrap; margin-bottom: 12px; }
    .confidence {
      display: inline-block; padding: 2px 10px; border-radius: 100px;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .confidence-high   { background: var(--green); }
    .confidence-medium { background: var(--orange); }
    .confidence-low    { background: var(--red); }
    .result-reason { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 100px;
      font-size: 11px; font-weight: 600; background: #eee; color: #444;
    }

    /* 候補リスト */
    .candidates-title { font-size: 12px; font-weight: 700; color: var(--muted);
                        margin-bottom: 6px; }
    .candidate-row { display: flex; align-items: center; gap: 8px;
                     margin-bottom: 4px; }
    .candidate-name { font-size: 13px; min-width: 180px; }
    .candidate-bar-wrap { flex: 1; height: 16px; background: #eee;
                          border-radius: 100px; overflow: hidden; }
    .candidate-bar { height: 100%; background: var(--accent); border-radius: 100px;
                     transition: width .4s; }
    .candidate-score { font-size: 12px; color: var(--muted); min-width: 40px;
                       text-align: right; }

    /* ── 使用率集計デモ ── */
    .usage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .usage-table th { background: var(--accent); color: #fff; padding: 8px 12px;
                      text-align: left; font-weight: 600; }
    .usage-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .usage-table tr:last-child td { border-bottom: none; }
    .usage-table tr:hover td { background: var(--bg); }
    .rate-bar-wrap { width: 120px; height: 14px; background: #eee;
                     border-radius: 100px; overflow: hidden; display: inline-block;
                     vertical-align: middle; margin-right: 6px; }
    .rate-bar { height: 100%; background: var(--accent); border-radius: 100px; }

    /* ── ルール一覧 ── */
    .rule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
                 gap: 10px; }
    .rule-card { background: var(--bg); border: 1px solid var(--border);
                 border-radius: 6px; padding: 12px; }
    .rule-card-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .rule-card-detail { font-size: 11px; color: var(--muted); line-height: 1.7; }
    .rule-priority { display: inline-block; padding: 1px 6px; border-radius: 4px;
                     font-size: 10px; font-weight: 700; background: var(--accent);
                     color: #fff; margin-left: 4px; }

    /* ── セクション見出し ── */
    h2 { font-size: 18px; font-weight: 700; margin: 40px 0 16px;
         padding-bottom: 8px; border-bottom: 2px solid var(--border); }

    @media (max-width: 600px) {
      .card-row { grid-template-columns: 1fr 60px 80px 24px; }
      .result-name { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="container">
<h1>🃏 デッキ自動判定ロジック — デモ</h1>
<p class="subtitle">
    カードを追加して「判定する」を押すと、デッキ名・信頼度・タグを自動判定します。<br/>
    プリセットから既知デッキを読み込むこともできます。
  </p>
<!-- ── カード入力 ── -->
<div class="panel">
<div class="panel-title">📋 カードを追加</div>
<!-- プリセット -->
<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">
      プリセットデッキを読み込む
    </div>
<div class="preset-row" id="preset-row"></div>
<!-- 手動入力 -->
<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;margin-top:12px;">
      手動でカードを追加
    </div>
<div class="input-row">
<input id="card-name" placeholder="カード名（例：リザードン ex）" type="text"/>
<input id="card-count" max="4" min="1" type="number" value="4"/>
<select id="card-cat">
<option value="pokemon">ポケモン</option>
<option value="goods">グッズ</option>
<option value="tool">どうぐ</option>
<option value="supporter">サポート</option>
<option value="stadium">スタジアム</option>
<option value="energy">エネルギー</option>
</select>
<button class="btn-primary" onclick="addCard()">追加</button>
</div>
<!-- カードリスト -->
<div id="card-list"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="btn-primary" onclick="classify()" style="flex:1;min-width:120px;">
        🔍 判定する
      </button>
<button class="btn-danger btn-sm" onclick="clearCards()">リセット</button>
</div>
</div>
<!-- ── 判定結果 ── -->
<div id="result">
<div class="result-box">
<div class="result-name" id="result-name">—</div>
<div class="result-meta">
<span class="confidence" id="result-confidence">—</span>
<span id="result-reason" style="font-size:13px;color:var(--muted);"></span>
</div>
<div class="tags" id="result-tags"></div>
<div class="candidates-title">判定候補スコア</div>
<div id="result-candidates"></div>
</div>
</div>
<!-- ── 使用率集計デモ ── -->
<h2>📊 使用率集計デモ（サンプル大会）</h2>
<div class="panel">
<div class="panel-title">チャンピオンズリーグ2026 愛知 May — マスターリーグ（サンプル）</div>
<div id="usage-table-wrap">
<p style="color:var(--muted);font-size:13px;">読み込み中…</p>
</div>
</div>
<!-- ── ルール一覧 ── -->
<h2>📖 判定ルール一覧</h2>
<div class="rule-grid" id="rule-grid"></div>
</div>
<script src="deckClassifier.js"></script>
<script>
/* ============================================================
   デモ用スクリプト
   ============================================================ */

const DC = window.DeckClassifier;

/* ── プリセットデータ ── */
const PRESETS = {
  'リザードン ex': [
    { name: 'リザードン ex',  count: 3, category: 'pokemon' },
    { name: 'リザード',        count: 2, category: 'pokemon' },
    { name: 'ヒトカゲ',        count: 4, category: 'pokemon' },
    { name: 'ピジョット ex',   count: 2, category: 'pokemon' },
    { name: 'ピジョン',        count: 1, category: 'pokemon' },
    { name: 'ポッポ',          count: 2, category: 'pokemon' },
    { name: 'ハイパーボール',  count: 4, category: 'goods' },
    { name: 'ボスの指令',      count: 3, category: 'supporter' },
    { name: '基本炎エネルギー',count: 10, category: 'energy' },
  ],
  'ルギア VSTAR': [
    { name: 'ルギア VSTAR',       count: 3, category: 'pokemon' },
    { name: 'ルギア V',           count: 4, category: 'pokemon' },
    { name: 'アーケオス',         count: 4, category: 'pokemon' },
    { name: 'ネオラントV',        count: 1, category: 'pokemon' },
    { name: '基本無色エネルギー', count: 8, category: 'energy' },
  ],
  'ロストバレット': [
    { name: 'ウッウ',              count: 3, category: 'pokemon' },
    { name: 'キュワワー',          count: 4, category: 'pokemon' },
    { name: 'ヤミラミ',            count: 2, category: 'pokemon' },
    { name: 'かがやくゲッコウガ',  count: 1, category: 'pokemon' },
    { name: 'ロストスイーパー',    count: 4, category: 'goods' },
    { name: '基本水エネルギー',    count: 4, category: 'energy' },
    { name: '基本超エネルギー',    count: 3, category: 'energy' },
  ],
  'ロストギラティナ': [
    { name: 'ギラティナ V',        count: 4, category: 'pokemon' },
    { name: 'ギラティナ VSTAR',    count: 3, category: 'pokemon' },
    { name: 'キュワワー',          count: 4, category: 'pokemon' },
    { name: 'ウッウ',              count: 2, category: 'pokemon' },
    { name: '基本超エネルギー',    count: 8, category: 'energy' },
  ],
  'カビゴン LO': [
    { name: 'カビゴン',            count: 4, category: 'pokemon' },
    { name: 'ヤレユータン',        count: 2, category: 'pokemon' },
    { name: 'ワタシラガ V',        count: 2, category: 'pokemon' },
    { name: 'ハイパーボール',      count: 4, category: 'goods' },
    { name: '基本無色エネルギー',  count: 2, category: 'energy' },
  ],
  'パオジアン ex': [
    { name: 'パオジアン ex',       count: 3, category: 'pokemon' },
    { name: 'セグレイブ',          count: 3, category: 'pokemon' },
    { name: 'セゴール',            count: 2, category: 'pokemon' },
    { name: 'チョッパー',          count: 4, category: 'pokemon' },
    { name: '基本水エネルギー',    count: 12, category: 'energy' },
  ],
  '未分類（フシギバナ）': [
    { name: 'フシギバナ ex',       count: 3, category: 'pokemon' },
    { name: 'フシギソウ',          count: 2, category: 'pokemon' },
    { name: 'フシギダネ',          count: 4, category: 'pokemon' },
    { name: '基本草エネルギー',    count: 12, category: 'energy' },
  ],
};

/* ── 使用率集計サンプルデータ ── */
const SAMPLE_EVENT = [
  { cards: PRESETS['リザードン ex'],   playerName: 'プレイヤーA', rank: 1 },
  { cards: PRESETS['リザードン ex'],   playerName: 'プレイヤーB', rank: 2 },
  { cards: PRESETS['リザードン ex'],   playerName: 'プレイヤーC', rank: 3 },
  { cards: PRESETS['ルギア VSTAR'],    playerName: 'プレイヤーD', rank: 3 },
  { cards: PRESETS['ルギア VSTAR'],    playerName: 'プレイヤーE', rank: 5 },
  { cards: PRESETS['ロストバレット'],  playerName: 'プレイヤーF', rank: 5 },
  { cards: PRESETS['ロストギラティナ'],playerName: 'プレイヤーG', rank: 5 },
  { cards: PRESETS['パオジアン ex'],   playerName: 'プレイヤーH', rank: 5 },
  { cards: PRESETS['カビゴン LO'],     playerName: 'プレイヤーI', rank: 9 },
  { cards: PRESETS['未分類（フシギバナ）'], playerName: 'プレイヤーJ', rank: 9 },
];

/* ── 状態 ── */
let cards = [];

/* ── カード追加 ── */
function addCard() {
  const name  = document.getElementById('card-name').value.trim();
  const count = parseInt(document.getElementById('card-count').value, 10);
  const cat   = document.getElementById('card-cat').value;
  if (!name) return;
  cards.push({ id: String(Date.now()), name, count: isNaN(count) ? 1 : count, category: cat });
  document.getElementById('card-name').value = '';
  renderCardList();
}

function removeCard(idx) {
  cards.splice(idx, 1);
  renderCardList();
}

function clearCards() {
  cards = [];
  renderCardList();
  document.getElementById('result').style.display = 'none';
}

function loadPreset(name) {
  cards = PRESETS[name].map((c, i) => ({ ...c, id: String(i) }));
  renderCardList();
  classify();
}

/* ── カードリスト描画 ── */
const CAT_LABEL = {
  pokemon: 'ポケモン', goods: 'グッズ', tool: 'どうぐ',
  supporter: 'サポート', stadium: 'スタジアム', energy: 'エネルギー',
};

function renderCardList() {
  const el = document.getElementById('card-list');
  if (cards.length === 0) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:8px 0;">カードがありません</p>';
    return;
  }
  el.innerHTML = cards.map((c, i) => `
    <div class="card-row">
      <span class="card-name">${esc(c.name)}</span>
      <span class="card-count">${c.count}枚</span>
      <span class="card-cat">${CAT_LABEL[c.category] || c.category}</span>
      <button class="remove-btn" onclick="removeCard(${i})" title="削除">×</button>
    </div>
  `).join('');
}

/* ── 判定実行 ── */
function classify() {
  if (cards.length === 0) {
    alert('カードを追加してください');
    return;
  }
  const result = DC.classifyDeck(cards);
  renderResult(result);
}

function renderResult(result) {
  const el = document.getElementById('result');
  el.style.display = 'block';

  document.getElementById('result-name').textContent = result.name;

  const confEl = document.getElementById('result-confidence');
  const confLabel = { high: '高信頼度', medium: '中信頼度', low: '低信頼度' };
  confEl.textContent = confLabel[result.confidence] || result.confidence;
  confEl.className = `confidence confidence-${result.confidence}`;

  document.getElementById('result-reason').textContent = result.reason;

  document.getElementById('result-tags').innerHTML =
    result.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');

  // 候補スコア
  const maxScore = result.candidates[0]?.score || 1;
  document.getElementById('result-candidates').innerHTML =
    result.candidates.length === 0
      ? '<p style="color:var(--muted);font-size:12px;">候補なし</p>'
      : result.candidates.map(c => `
          <div class="candidate-row">
            <span class="candidate-name">${esc(c.name)}</span>
            <div class="candidate-bar-wrap">
              <div class="candidate-bar" style="width:${Math.round(c.score/maxScore*100)}%"></div>
            </div>
            <span class="candidate-score">score: ${c.score}</span>
          </div>
        `).join('');

  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── 使用率集計テーブル ── */
function renderUsageTable() {
  const { summary, total } = DC.aggregateUsageRates(SAMPLE_EVENT);
  const maxCount = summary[0]?.count || 1;

  const rows = summary.map((item, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${esc(item.name)}</strong></td>
      <td>${item.count}人</td>
      <td>
        <div class="rate-bar-wrap">
          <div class="rate-bar" style="width:${Math.round(item.count/maxCount*100)}%"></div>
        </div>
        ${item.rate}%
      </td>
      <td>${item.tags.map(t => `<span class="tag">${esc(t)}</span>`).join(' ')}</td>
      <td style="font-size:11px;color:var(--muted);">${item.players.join('、')}</td>
    </tr>
  `).join('');

  document.getElementById('usage-table-wrap').innerHTML = `
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">
      参加者 ${total} 名のサンプルデータ
    </p>
    <div style="overflow-x:auto;">
      <table class="usage-table">
        <thead>
          <tr>
            <th>#</th><th>デッキ名</th><th>使用人数</th>
            <th>使用率</th><th>タグ</th><th>プレイヤー</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ── ルール一覧 ── */
function renderRuleGrid() {
  const el = document.getElementById('rule-grid');
  el.innerHTML = DC.DECK_RULES.map(rule => {
    const req = rule.conditions.required?.join('、') || '—';
    const any = rule.conditions.any?.join(' / ') || '';
    const forb = rule.conditions.forbidden?.join('、') || '';
    return `
      <div class="rule-card">
        <div class="rule-card-name">
          ${esc(rule.name)}
          <span class="rule-priority">P${rule.priority}</span>
        </div>
        <div class="rule-card-detail">
          <b>必須:</b> ${esc(req)}<br>
          ${any  ? `<b>いずれか:</b> ${esc(any)}<br>` : ''}
          ${forb ? `<b>除外:</b> ${esc(forb)}<br>` : ''}
          ${rule.conditions.custom ? '<b>カスタム条件あり</b><br>' : ''}
          <b>タグ:</b> ${rule.tags.join('・')}
        </div>
      </div>
    `;
  }).join('');
}

/* ── プリセットボタン ── */
function renderPresets() {
  const el = document.getElementById('preset-row');
  el.innerHTML = Object.keys(PRESETS).map(name => `
    <button class="preset-btn" onclick="loadPreset(${JSON.stringify(name)})">
      ${esc(name)}
    </button>
  `).join('');
}

/* ── ユーティリティ ── */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Enter キーで追加 ── */
document.getElementById('card-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCard();
});

/* ── 初期化 ── */
renderPresets();
renderCardList();
renderUsageTable();
renderRuleGrid();
</script>
</body>
</html>
